<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポモドーロ & タスク</title>
<style>
  :root {
    --bg: #1a1b26;
    --panel: #24263a;
    --panel-2: #2c2e45;
    --accent: #ff6b6b;
    --accent-2: #4ecdc4;
    --text: #e8e8f0;
    --text-dim: #9494ab;
    --border: #3a3c5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .timer-card {
    background: var(--panel);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    border: 1px solid var(--border);
    transition: box-shadow 0.3s;
  }
  .timer-card.running {
    box-shadow: 0 0 0 2px var(--accent-mode, var(--accent));
  }
  .mode-label {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .mode-label.work { color: var(--accent); }
  .mode-label.break { color: var(--accent-2); }
  .time-display {
    font-size: 4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-bottom: 20px;
    letter-spacing: 0.02em;
  }
  .progress-ring {
    width: 100%;
    height: 6px;
    background: var(--panel-2);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 1s linear;
  }
  .mode-label.break ~ .progress-ring .progress-fill,
  .progress-fill.break { background: var(--accent-2); }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  button {
    font-family: inherit;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.96); }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-secondary {
    background: var(--panel-2);
    color: var(--text);
  }
  .cycle-count {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 4px;
  }
  .task-card {
    background: var(--panel);
    border-radius: 20px;
    padding: 20px;
    border: 1px solid var(--border);
  }
  .task-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .task-input-row input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
  }
  .task-input-row input:focus {
    outline: none;
    border-color: var(--accent-2);
  }
  .task-input-row button {
    background: var(--accent-2);
    color: #12232a;
    padding: 10px 18px;
  }
  ul.task-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 260px;
    overflow-y: auto;
  }
  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .task-item.done .task-text {
    text-decoration: line-through;
    color: var(--text-dim);
  }
  .task-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent-2);
    cursor: pointer;
    flex-shrink: 0;
  }
  .task-text {
    flex: 1;
    font-size: 0.92rem;
    word-break: break-word;
  }
  .task-pomodoros {
    font-size: 0.78rem;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .task-delete {
    background: none;
    color: var(--text-dim);
    font-size: 1.1rem;
    padding: 2px 8px;
    line-height: 1;
    flex-shrink: 0;
  }
  .task-delete:hover { color: var(--accent); }
  .empty-state {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.88rem;
    padding: 16px 0;
  }
  .active-task-banner {
    font-size: 0.85rem;
    color: var(--text-dim);
    text-align: center;
    margin-top: -6px;
    min-height: 1.2em;
  }
  .active-task-banner strong { color: var(--text); }
</style>
</head>
<body>
<div class="app">
  <h1>🍅 ポモドーロ & タスク</h1>

  <div class="timer-card" id="timerCard">
    <div class="mode-label work" id="modeLabel">作業中</div>
    <div class="time-display" id="timeDisplay">25:00</div>
    <div class="progress-ring"><div class="progress-fill" id="progressFill"></div></div>
    <div class="controls">
      <button class="btn-primary" id="startBtn">開始</button>
      <button class="btn-secondary" id="resetBtn">リセット</button>
      <button class="btn-secondary" id="skipBtn">スキップ</button>
    </div>
    <div class="cycle-count" id="cycleCount">完了サイクル: 0</div>
    <div class="active-task-banner" id="activeTaskBanner"></div>
  </div>

  <div class="task-card">
    <div class="task-input-row">
      <input type="text" id="taskInput" placeholder="タスクを入力して Enter" maxlength="200">
      <button id="addTaskBtn">追加</button>
    </div>
    <ul class="task-list" id="taskList"></ul>
    <div class="empty-state" id="emptyState">タスクはまだありません</div>
  </div>
</div>

<audio id="dingSound" preload="auto">
  <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAgD4AAIA+AAABAAgAZGF0YQoAAACAgICAgICAgIA=" type="audio/wav">
</audio>

<script>
(function () {
  const WORK_MIN = 25;
  const BREAK_MIN = 5;
  const LONG_BREAK_MIN = 15;
  const CYCLES_BEFORE_LONG_BREAK = 4;

  const state = load() || {
    mode: 'work', // work | break
    remaining: WORK_MIN * 60,
    running: false,
    cyclesCompleted: 0,
    tasks: [],
    activeTaskId: null,
  };

  let intervalId = null;

  const timerCard = document.getElementById('timerCard');
  const modeLabel = document.getElementById('modeLabel');
  const timeDisplay = document.getElementById('timeDisplay');
  const progressFill = document.getElementById('progressFill');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const skipBtn = document.getElementById('skipBtn');
  const cycleCount = document.getElementById('cycleCount');
  const activeTaskBanner = document.getElementById('activeTaskBanner');
  const taskInput = document.getElementById('taskInput');
  const addTaskBtn = document.getElementById('addTaskBtn');
  const taskList = document.getElementById('taskList');
  const emptyState = document.getElementById('emptyState');
  const dingSound = document.getElementById('dingSound');

  function totalForMode(mode) {
    if (mode === 'work') return WORK_MIN * 60;
    if (state.cyclesCompleted > 0 && state.cyclesCompleted % CYCLES_BEFORE_LONG_BREAK === 0) {
      return LONG_BREAK_MIN * 60;
    }
    return BREAK_MIN * 60;
  }

  function save() {
    localStorage.setItem('pomodoro-tasks-state', JSON.stringify(state));
  }

  function load() {
    try {
      const raw = localStorage.getItem('pomodoro-tasks-state');
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      parsed.running = false; // don't auto-resume across reloads
      return parsed;
    } catch (e) {
      return null;
    }
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function render() {
    const total = totalForMode(state.mode);
    timeDisplay.textContent = formatTime(state.remaining);
    const pct = Math.max(0, Math.min(100, (1 - state.remaining / total) * 100));
    progressFill.style.width = pct + '%';

    if (state.mode === 'work') {
      modeLabel.textContent = '作業中';
      modeLabel.className = 'mode-label work';
      progressFill.className = 'progress-fill';
      document.title = `${formatTime(state.remaining)} - 作業中`;
    } else {
      const isLong = state.cyclesCompleted > 0 && state.cyclesCompleted % CYCLES_BEFORE_LONG_BREAK === 0;
      modeLabel.textContent = isLong ? '長い休憩' : '休憩中';
      modeLabel.className = 'mode-label break';
      progressFill.className = 'progress-fill break';
      document.title = `${formatTime(state.remaining)} - 休憩中`;
    }

    startBtn.textContent = state.running ? '一時停止' : '開始';
    timerCard.classList.toggle('running', state.running);
    cycleCount.textContent = `完了サイクル: ${state.cyclesCompleted}`;

    const activeTask = state.tasks.find(t => t.id === state.activeTaskId);
    activeTaskBanner.innerHTML = activeTask
      ? `取り組み中: <strong>${escapeHtml(activeTask.text)}</strong>`
      : (state.tasks.length ? 'タスクをクリックして選択できます' : '');

    renderTasks();
    save();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderTasks() {
    taskList.innerHTML = '';
    emptyState.style.display = state.tasks.length ? 'none' : 'block';

    state.tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '');
      if (task.id === state.activeTaskId) {
        li.style.outline = '2px solid var(--accent-2)';
      }

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.addEventListener('change', () => {
        task.done = checkbox.checked;
        render();
      });

      const text = document.createElement('span');
      text.className = 'task-text';
      text.textContent = task.text;
      text.style.cursor = 'pointer';
      text.title = 'クリックして「取り組み中」に設定';
      text.addEventListener('click', () => {
        state.activeTaskId = (state.activeTaskId === task.id) ? null : task.id;
        render();
      });

      const pomCount = document.createElement('span');
      pomCount.className = 'task-pomodoros';
      pomCount.textContent = task.pomodoros ? `🍅×${task.pomodoros}` : '';

      const delBtn = document.createElement('button');
      delBtn.className = 'task-delete';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', () => {
        state.tasks = state.tasks.filter(t => t.id !== task.id);
        if (state.activeTaskId === task.id) state.activeTaskId = null;
        render();
      });

      li.appendChild(checkbox);
      li.appendChild(text);
      li.appendChild(pomCount);
      li.appendChild(delBtn);
      taskList.appendChild(li);
    });
  }

  function tick() {
    state.remaining -= 1;
    if (state.remaining <= 0) {
      handlePhaseComplete();
    } else {
      render();
    }
  }

  function handlePhaseComplete() {
    playDing();
    if (state.mode === 'work') {
      state.cyclesCompleted += 1;
      const activeTask = state.tasks.find(t => t.id === state.activeTaskId);
      if (activeTask) {
        activeTask.pomodoros = (activeTask.pomodoros || 0) + 1;
      }
      state.mode = 'break';
    } else {
      state.mode = 'work';
    }
    state.remaining = totalForMode(state.mode);
    state.running = false;
    stopInterval();
    render();
  }

  function playDing() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    } catch (e) { /* audio not available */ }
  }

  function startInterval() {
    stopInterval();
    intervalId = setInterval(tick, 1000);
  }

  function stopInterval() {
    if (intervalId) {
      clearInterval(intervalId);
      intervalId = null;
    }
  }

  startBtn.addEventListener('click', () => {
    state.running = !state.running;
    if (state.running) {
      startInterval();
    } else {
      stopInterval();
    }
    render();
  });

  resetBtn.addEventListener('click', () => {
    state.running = false;
    stopInterval();
    state.remaining = totalForMode(state.mode);
    render();
  });

  skipBtn.addEventListener('click', () => {
    state.running = false;
    stopInterval();
    handlePhaseComplete();
  });

  function addTask() {
    const text = taskInput.value.trim();
    if (!text) return;
    state.tasks.push({ id: Date.now() + Math.random(), text, done: false, pomodoros: 0 });
    taskInput.value = '';
    render();
  }

  addTaskBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.keyCode === 13) addTask();
  });

  if (state.running) {
    state.running = false;
  }

  render();
})();
</script>
</body>
</html>
